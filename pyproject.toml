[project]
name = "pardon-my-english"
version = "0.2.0"
description = "Telegram bot for rewriting text into polished English."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "cachetools>=7.2.0",
    "openai>=3.24.0",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "sqlalchemy>=2.0.54,<2.1",  # sqlmodel does not support 2.1 yet
    "sqlmodel>=0.0.47",
]

[tool.uv]
package = false

[tool.ty.environment]
root = [".", "./telegram-bot"]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
