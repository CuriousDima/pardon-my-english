[project]
name = "pardon-my-english"
version = "0.3.0"
description = "Telegram bot for rewriting text into polished English."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.24.0",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "sqlalchemy>=2.0.54,<2.1",  # sqlmodel does not support 2.1 yet
    "sqlmodel>=0.0.47",
]

[project.scripts]
pardon-my-english = "pardon_my_english.bot:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.pytest]
testpaths = ["tests"]
